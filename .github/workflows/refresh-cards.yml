name: Refresh profile cards

# Rebuilds the contribution data and re-renders every SVG card once a day.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install font tooling (pyftsubset)
        run: python -m pip install --upgrade fonttools brotli

      - name: Refresh data/contributions.json
        env:
          # A PAT with read:user is only needed for private contributions.
          # Public contribution calendars work with the built-in GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python scripts/render_cards.py --fetch-only

      - name: Run the renderer (all SVG cards)
        run: python scripts/render_cards.py

      - name: Commit refreshed data and rendered cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "chore(cards): refresh contribution data and SVG cards"
            git push
          fi
