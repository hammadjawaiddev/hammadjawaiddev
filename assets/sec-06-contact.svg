<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 78" width="1000" height="78">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#123540"/><stop offset=".45" stop-color="#0f222c"/><stop offset="1" stop-color="#0a1820"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#3fd0c9" stop-opacity=".85"/><stop offset="1" stop-color="#3fd0c9" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7be3b5"/><stop offset="1" stop-color="#3fd0c9"/></linearGradient>
</defs>
<style>
@keyframes sweep{0%{transform:translateX(-150px)}100%{transform:translateX(1000px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<path d="M0 10 L12 0 H1000 V78 H0 Z" fill="url(#bg)"/>
<rect x="0" y="0" width="3" height="54" fill="url(#edge)" opacity=".9"/>
<rect x="0" y="76" width="1000" height="2" fill="url(#ln)"/>
<rect x="0" y="76" width="140" height="2" fill="#7be3b5" opacity=".9" style="animation:sweep 3.8s linear infinite"/>
<circle cx="28" cy="39" r="5" fill="#7be3b5" style="animation:blink 1.5s steps(1) infinite"/>
<text x="48" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3fd0c9" letter-spacing="3">06</text>
<text x="96" y="51" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f2fbfa" letter-spacing="3" style="animation:rise .6s ease-out both">OPEN A CHANNEL</text>
<text x="986" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#8fb8b5" letter-spacing="3" text-anchor="end">LET'S BUILD</text>
<path d="M962 8 h24 v24" fill="none" stroke="#3fd0c9" stroke-opacity=".35" stroke-width="2"/>
</svg>